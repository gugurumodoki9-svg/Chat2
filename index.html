<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1対1チャット</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:#f3f4f6;
  color:#111827;
}

.app{
  width:100%;
  max-width:850px;
  height:100dvh;
  margin:auto;
  background:white;
  display:flex;
  flex-direction:column;
}

/* ヘッダー */

header{
  height:56px;
  flex:none;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #e5e7eb;
}

header strong{
  font-size:16px;
}

.room{
  margin-left:auto;
  color:#9ca3af;
  font-size:10px;
}

/* メッセージ */

#messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#f8fafc;
}

.empty{
  text-align:center;
  color:#9ca3af;
  margin-top:30vh;
  font-size:13px;
}

.row{
  display:flex;
  margin:6px 0;
}

.row.me{
  justify-content:flex-end;
}

.bubble{
  max-width:min(78%,560px);
  padding:9px 11px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  background:white;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.row.me .bubble{
  background:#eaf1ff;
  border-color:#d8e5ff;
}

.meta{
  margin-top:3px;
  color:#9ca3af;
  font-size:10px;
}

.row.me .meta{
  text-align:right;
}

/* 入力欄 */

#form{
  flex:none;
  display:flex;
  gap:7px;
  padding:9px 10px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
  border-top:1px solid #e5e7eb;
}

#text{
  flex:1;
  min-width:0;
  height:42px;
  max-height:110px;
  resize:none;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:10px;
  outline:none;
  font:inherit;
}

button{
  border:0;
  border-radius:11px;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

#send{
  width:62px;
  background:#2563eb;
}

#call{
  width:48px;
  background:#16a34a;
}

/* 名前入力 */

#login{
  position:fixed;
  inset:0;
  z-index:20;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(380px,100%);
  padding:22px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  text-align:center;
}

.card h2{
  margin:0 0 8px;
}

.card p{
  color:#6b7280;
  font-size:13px;
}

#name{
  width:100%;
  height:44px;
  padding:0 12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

#enter{
  width:100%;
  height:44px;
  margin-top:10px;
  background:#2563eb;
}

#error{
  min-height:18px;
  margin-top:8px;
  color:#dc2626;
  font-size:12px;
}

/* 通話 */

#callbox{
  position:fixed;
  z-index:15;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(350px,calc(100% - 28px));
  padding:16px;
  background:white;
  border:1px solid #ddd;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.15);
  text-align:center;
}

#calltitle{
  font-size:18px;
  font-weight:700;
}

#callstatus{
  margin:6px 0 14px;
  color:#6b7280;
  font-size:13px;
}

#actions{
  display:flex;
  gap:8px;
}

#actions button{
  flex:1;
  height:42px;
}

.accept{
  background:#16a34a;
}

.reject,
.hangup{
  background:#dc2626;
}

.mute{
  background:#374151;
}

/* 通知 */

#notice{
  position:fixed;
  z-index:30;
  top:66px;
  left:50%;
  transform:translateX(-50%);
  max-width:calc(100% - 28px);
  padding:8px 12px;
  background:#fff7ed;
  color:#9a3412;
  border:1px solid #fed7aa;
  border-radius:10px;
  font-size:12px;
  text-align:center;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div class="app">

  <header>
    <strong>1対1チャット</strong>
    <span class="room">ROOM: ryo1031jun0106</span>
  </header>

  <main id="messages">
    <div class="empty">
      メッセージを読み込み中…
    </div>
  </main>

  <form id="form">

    <textarea
      id="text"
      maxlength="2000"
      placeholder="メッセージ…"
    ></textarea>

    <button
      id="call"
      type="button"
      title="音声通話"
    >
      📞
    </button>

    <button
      id="send"
      type="submit"
    >
      送信
    </button>

  </form>

</div>


<!-- 名前入力 -->

<div id="login">

  <div class="card">

    <h2>名前を入力</h2>

    <p>
      表示する名前を決めてください。
    </p>

    <input
      id="name"
      maxlength="30"
      autocomplete="nickname"
      placeholder="名前"
    >

    <button id="enter">
      入室する
    </button>

    <div id="error"></div>

  </div>

</div>


<!-- 通話画面 -->

<div id="callbox" class="hidden">

  <div id="calltitle">
    音声通話
  </div>

  <div id="callstatus"></div>

  <div id="actions"></div>

</div>


<div id="notice" class="hidden"></div>

<audio
  id="remote"
  autoplay
  playsinline
></audio>


<script type="module">

/*
====================================================
 Firebase
====================================================
*/

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";


/*
====================================================
 Firebase設定
====================================================
*/

const firebaseConfig = {

  apiKey:
    "AIzaSyA-SopUchu7bKXw0k2ZoYYds03Lduz-nAk",

  authDomain:
    "chat2-9bd77.firebaseapp.com",

  projectId:
    "chat2-9bd77",

  storageBucket:
    "chat2-9bd77.firebasestorage.app",

  messagingSenderId:
    "813264060979",

  appId:
    "1:813264060979:web:3b5ae389958989eb2b1946"

};


/*
====================================================
 基本設定
====================================================
*/

const ROOM = "ryo1031jun0106";

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const $ =
  id => document.getElementById(id);


/*
====================================================
 状態
====================================================
*/

let user = null;

let name =
  localStorage.getItem("chat_name") || "";

let messagesUnsubscribe = null;

let callUnsubscribe = null;

let candidateUnsubscribe = null;

let peerConnection = null;

let localStream = null;

let isCaller = false;

let incomingCall = false;

let muted = false;

let callTimer = null;


/*
====================================================
 WebRTC
====================================================
*/

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    }

  ]

};


/*
====================================================
 通知
====================================================
*/

function showNotice(message){

  const notice =
    $("notice");

  notice.textContent =
    message;

  notice.classList.remove(
    "hidden"
  );

  setTimeout(() => {

    notice.classList.add(
      "hidden"
    );

  },4500);

}


/*
====================================================
 HTMLエスケープ
====================================================
*/

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      })[character]
    );

}


/*
====================================================
 時刻
====================================================
*/

function formatTime(value){

  const date =
    value?.toDate
      ? value.toDate()
      : new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  return date.toLocaleTimeString(
    "ja-JP",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/*
====================================================
 入室
====================================================
*/

async function login(){

  name =
    $("name").value.trim();

  if(!name){

    $("error").textContent =
      "名前を入力してください。";

    return;

  }

  localStorage.setItem(
    "chat_name",
    name
  );

  $("enter").disabled =
    true;

  $("error").textContent =
    "";

  try{

    await signInAnonymously(
      auth
    );

  }catch(error){

    console.error(error);

    $("enter").disabled =
      false;

    $("error").textContent =
      "入室できませんでした。Firebaseの匿名ログインを有効にしてください。";

  }

}


$("enter").onclick =
  login;


$("name").addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      login();

    }

  }
);


if(name){

  $("name").value =
    name;

}


/*
====================================================
 Firebaseログイン監視
====================================================
*/

onAuthStateChanged(
  auth,
  async currentUser => {

    if(!currentUser){

      return;

    }

    user =
      currentUser;

    $("login")
      .classList
      .add("hidden");


    try{

      await setDoc(

        doc(
          db,
          "users",
          user.uid
        ),

        {
          name:name,
          updatedAt:
            serverTimestamp()
        },

        {
          merge:true
        }

      );

    }catch(error){

      console.warn(
        "user save:",
        error
      );

    }


    loadMessages();

    listenForCalls();

  }
);


/*
====================================================
 メッセージ読み込み
====================================================
*/

function loadMessages(){

  if(
    messagesUnsubscribe
  ){

    messagesUnsubscribe();

  }


  const messagesRef =
    collection(
      db,
      "rooms",
      ROOM,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  messagesUnsubscribe =
    onSnapshot(

      messagesQuery,

      snapshot => {

        const box =
          $("messages");

        box.innerHTML =
          "";


        if(snapshot.empty){

          box.innerHTML =
            `
            <div class="empty">
              メッセージはありません
            </div>
            `;

          return;

        }


        snapshot.forEach(
          messageDoc => {

            const message =
              messageDoc.data();

            const mine =
              message.senderId ===
              user.uid;


            const row =
              document.createElement(
                "div"
              );


            row.className =
              mine
                ? "row me"
                : "row";


            row.innerHTML =

              `
              <div class="bubble">

                <div>
                  ${escapeHtml(
                    message.text
                  )}
                </div>

                <div class="meta">

                  ${escapeHtml(
                    message.senderName || ""
                  )}

                  ·

                  ${formatTime(
                    message.createdAt
                  )}

                </div>

              </div>
              `;


            box.appendChild(
              row
            );

          }
        );


        box.scrollTop =
          box.scrollHeight;

      },

      error => {

        console.error(error);

        showNotice(
          "メッセージを読み込めません。Firestoreのルールを確認してください。"
        );

      }

    );

}


/*
====================================================
 メッセージ送信
====================================================
*/

$("form").addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      $("text")
        .value
        .trim();


    if(
      !text ||
      !user
    ){

      return;

    }


    $("send").disabled =
      true;


    try{

      await addDoc(

        collection(
          db,
          "rooms",
          ROOM,
          "messages"
        ),

        {

          text:text,

          senderId:
            user.uid,

          senderName:
            name,

          createdAt:
            serverTimestamp()

        }

      );


      $("text").value =
        "";

      $("text").style.height =
        "42px";


    }catch(error){

      console.error(error);

      showNotice(
        "送信できませんでした。Firestoreの書き込み権限を確認してください。"
      );

    }


    $("send").disabled =
      false;

    $("text").focus();

  }
);


/*
====================================================
 テキスト欄自動拡張
====================================================
*/

$("text").addEventListener(
  "input",
  () => {

    $("text").style.height =
      "42px";

    $("text").style.height =
      Math.min(
        $("text").scrollHeight,
        110
      ) + "px";

  }
);


/*
====================================================
 通話画面
====================================================
*/

function showCallPanel(
  title,
  status,
  buttons
){

  $("calltitle")
    .textContent =
    title;

  $("callstatus")
    .textContent =
    status;


  const actions =
    $("actions");

  actions.innerHTML =
    "";


  buttons.forEach(
    buttonInfo => {

      const [
        className,
        label,
        handler
      ] = buttonInfo;


      const button =
        document.createElement(
          "button"
        );


      button.className =
        className;

      button.textContent =
        label;

      button.onclick =
        handler;


      actions.appendChild(
        button
      );

    }
  );


  $("callbox")
    .classList
    .remove("hidden");

}


function closeCallPanel(){

  $("callbox")
    .classList
    .add("hidden");

  $("actions").innerHTML =
    "";

}


/*
====================================================
 通話タイマー
====================================================
*/

function startCallTimer(){

  const started =
    Date.now();


  clearInterval(
    callTimer
  );


  callTimer =
    setInterval(
      () => {

        const seconds =
          Math.floor(
            (Date.now() - started) /
            1000
          );


        const minutes =
          Math.floor(
            seconds / 60
          );


        const sec =
          String(
            seconds % 60
          ).padStart(
            2,
            "0"
          );


        $("callstatus")
          .textContent =
          `通話中 ${minutes}:${sec}`;

      },
      1000
    );

}


/*
====================================================
 ミュート
====================================================
*/

function toggleMute(){

  muted =
    !muted;


  if(localStream){

    localStream
      .getAudioTracks()
      .forEach(
        track => {

          track.enabled =
            !muted;

        }
      );

  }


  document
    .querySelectorAll(
      "#actions .mute"
    )
    .forEach(
      button => {

        button.textContent =
          muted
            ? "🔊 ミュート解除"
            : "🔇 ミュート";

      }
    );

}


/*
====================================================
 通話終了処理
====================================================
*/

async function cleanupCall(
  updateServer = false
){

  if(updateServer){

    try{

      await updateDoc(

        doc(
          db,
          "calls",
          ROOM
        ),

        {
          status:"ended"
        }

      );

    }catch(error){

      console.warn(error);

    }

  }


  if(callUnsubscribe){

    callUnsubscribe();

    callUnsubscribe =
      null;

  }


  if(candidateUnsubscribe){

    candidateUnsubscribe();

    candidateUnsubscribe =
      null;

  }


  clearInterval(
    callTimer
  );

  callTimer =
    null;


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream =
      null;

  }


  if(peerConnection){

    peerConnection.close();

    peerConnection =
      null;

  }


  $("remote").srcObject =
    null;


  closeCallPanel();


  $("call").disabled =
    false;


  isCaller =
    false;

  incomingCall =
    false;

  muted =
    false;

}


/*
====================================================
 発信
====================================================
*/

async function startVoiceCall(){

  if(
    peerConnection ||
    !user
  ){

    return;

  }


  $("call").disabled =
    true;


  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },

          video:false

        });


    peerConnection =
      new RTCPeerConnection(
        rtcConfig
      );


    isCaller =
      true;


    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection.addTrack(
            track,
            localStream
          );

        }
      );


    peerConnection.ontrack =
      event => {

        $("remote")
          .srcObject =
          event.streams[0];


        $("remote")
          .play()
          .catch(
            () => {}
          );

      };


    peerConnection.onicecandidate =
      async event => {

        if(
          !event.candidate
        ){

          return;

        }


        try{

          await addDoc(

            collection(
              db,
              "calls",
              ROOM,
              "callerCandidates"
            ),

            event.candidate.toJSON()

          );

        }catch(error){

          console.error(
            error
          );

        }

      };


    const callRef =
      doc(
        db,
        "calls",
        ROOM
      );


    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    await setDoc(

      callRef,

      {

        callerId:
          user.uid,

        callerName:
          name,

        status:
          "ringing",

        offer:{
          type:offer.type,
          sdp:offer.sdp
        },

        createdAt:
          serverTimestamp()

      }

    );


    showCallPanel(

      "📞 発信中",

      "相手の応答を待っています…",

      [

        [
          "hangup",
          "通話終了",
          () =>
            cleanupCall(true)
        ]

      ]

    );


    callUnsubscribe =
      onSnapshot(

        callRef,

        async snapshot => {

          const data =
            snapshot.data();


          if(
            !data ||
            !peerConnection
          ){

            return;

          }


          if(
            data.status ===
            "declined"
          ){

            await cleanupCall(
              false
            );

            showNotice(
              "通話を拒否されました。"
            );

            return;

          }


          if(
            data.answer &&
            peerConnection
              .signalingState ===
              "have-local-offer"
          ){

            try{

              await peerConnection
                .setRemoteDescription(
                  data.answer
                );

            }catch(error){

              console.error(
                error
              );

            }

          }


          if(
            data.status ===
            "connected"
          ){

            showCallPanel(

              "📞 音声通話",

              "通話中 0:00",

              [

                [
                  "mute",
                  "🔇 ミュート",
                  toggleMute
                ],

                [
                  "hangup",
                  "通話終了",
                  () =>
                    cleanupCall(true)
                ]

              ]

            );


            startCallTimer();

          }


          if(
            data.status ===
            "ended"
          ){

            cleanupCall(
              false
            );

          }

        }

      );


    candidateUnsubscribe =
      onSnapshot(

        collection(
          db,
          "calls",
          ROOM,
          "answerCandidates"
        ),

        snapshot => {

          snapshot
            .docChanges()
            .forEach(
              async change => {

                if(
                  change.type !==
                  "added" ||
                  !peerConnection
                ){

                  return;

                }


                try{

                  await peerConnection
                    .addIceCandidate(
                      change.doc.data()
                    );

                }catch(error){

                  console.warn(
                    "ICE:",
                    error
                  );

                }

              }
            );

        }

      );


  }catch(error){

    console.error(
      error
    );


    await cleanupCall(
      false
    );


    if(
      error.name ===
      "NotAllowedError"
    ){

      showNotice(
        "マイクの使用を許可してください。"
      );

    }else{

      showNotice(
        "音声通話を開始できませんでした。"
      );

    }

  }

}


/*
====================================================
 着信監視
====================================================
*/

function listenForCalls(){

  const callRef =
    doc(
      db,
      "calls",
      ROOM
    );


  callUnsubscribe =
    onSnapshot(

      callRef,

      snapshot => {

        const data =
          snapshot.data();


        if(
          !data ||
          !user
        ){

          return;

        }


        if(
          data.callerId ===
          user.uid
        ){

          return;

        }


        if(

          data.status ===
          "ringing" &&

          data.offer &&

          !peerConnection &&

          !incomingCall

        ){

          incomingCall =
            true;


          showCallPanel(

            "📞 着信",

            `${data.callerName || "相手"}から音声通話`,

            [

              [
                "accept",
                "📞 応答",
                answerVoiceCall
              ],

              [
                "reject",
                "拒否",
                rejectVoiceCall
              ]

            ]

          );

        }


        if(

          data.status ===
          "ended" &&

          peerConnection &&

          !isCaller

        ){

          cleanupCall(
            false
          );

        }

      }

    );

}


/*
====================================================
 着信拒否
====================================================
*/

async function rejectVoiceCall(){

  try{

    await updateDoc(

      doc(
        db,
        "calls",
        ROOM
      ),

      {
        status:"declined"
      }

    );

  }catch(error){

    console.error(
      error
    );

  }


  incomingCall =
    false;


  closeCallPanel();

}


/*
====================================================
 着信応答
====================================================
*/

async function answerVoiceCall(){

  incomingCall =
    false;


  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },

          video:false

        });


    peerConnection =
      new RTCPeerConnection(
        rtcConfig
      );


    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection.addTrack(
            track,
            localStream
          );

        }
      );


    peerConnection.ontrack =
      event => {

        $("remote")
          .srcObject =
          event.streams[0];


        $("remote")
          .play()
          .catch(
            () => {}
          );

      };


    peerConnection.onicecandidate =
      async event => {

        if(
          !event.candidate
        ){

          return;

        }


        try{

          await addDoc(

            collection(
              db,
              "calls",
              ROOM,
              "answerCandidates"
            ),

            event.candidate.toJSON()

          );

        }catch(error){

          console.error(
            error
          );

        }

      };


    const callRef =
      doc(
        db,
        "calls",
        ROOM
      );


    const snapshot =
      await getDoc(
        callRef
      );


    const data =
      snapshot.data();


    if(
      !data ||
      !data.offer
    ){

      throw new Error(
        "通話情報がありません"
      );

    }


    await peerConnection
      .setRemoteDescription(
        data.offer
      );


    candidateUnsubscribe =
      onSnapshot(

        collection(
          db,
          "calls",
          ROOM,
          "callerCandidates"
        ),

        snapshot => {

          snapshot
            .docChanges()
            .forEach(
              async change => {

                if(
                  change.type !==
                  "added" ||
                  !peerConnection
                ){

                  return;

                }


                try{

                  await peerConnection
                    .addIceCandidate(
                      change.doc.data()
                    );

                }catch(error){

                  console.warn(
                    "ICE:",
                    error
                  );

                }

              }
            );

        }

      );


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    await updateDoc(

      callRef,

      {

        answer:{
          type:answer.type,
          sdp:answer.sdp
        },

        status:
          "connected"

      }

    );


    showCallPanel(

      "📞 音声通話",

      "通話中 0:00",

      [

        [
          "mute",
          "🔇 ミュート",
          toggleMute
        ],

        [
          "hangup",
          "通話終了",
          () =>
            cleanupCall(true)
        ]

      ]

    );


    startCallTimer();


  }catch(error){

    console.error(
      error
    );


    await cleanupCall(
      false
    );


    showNotice(
      "通話に応答できませんでした。"
    );

  }

}


/*
====================================================
 通話ボタン
====================================================
*/

$("call").onclick =
  startVoiceCall;


/*
====================================================
 ページを閉じたとき
====================================================
*/

window.addEventListener(
  "beforeunload",
  () => {

    if(localStream){

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(peerConnection){

      peerConnection.close();

    }

  }
);

</script>
