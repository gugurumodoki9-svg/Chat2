<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1対1チャット</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif}body{background:#f3f4f6}.app{height:100dvh;max-width:850px;margin:auto;background:white;display:flex;flex-direction:column}header{padding:14px;border-bottom:1px solid #ddd}#messages{flex:1;overflow:auto;padding:12px;background:#f8fafc}.r{display:flex;margin:5px 0}.me{justify-content:flex-end}.b{max-width:78%;padding:9px 11px;border:1px solid #ddd;border-radius:14px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}.me .b{background:#eaf1ff}.m{font-size:10px;color:#999;margin-top:3px}form{display:flex;gap:7px;padding:9px;border-top:1px solid #ddd}textarea{flex:1;height:42px;resize:none;border:1px solid #ccc;border-radius:10px;padding:10px}button{border:0;border-radius:10px;color:#fff;font-weight:bold}#send{width:62px;background:#2563eb}#call{width:48px;background:#16a34a}.login,.call{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f3f4f6;z-index:5}.card,.callcard{width:min(380px,calc(100% - 30px));padding:22px;background:#fff;border:1px solid #ddd;border-radius:18px;text-align:center}.card input{width:100%;height:44px;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:16px}.card button{width:100%;height:44px;margin-top:10px;background:#2563eb}.call{inset:auto 15px 15px;z-index:4}.callcard button{padding:12px 18px;margin:4px}.ok{background:#16a34a}.no{background:#dc2626}.mute{background:#374151}.hidden{display:none}.err{color:#c00;font-size:12px;margin-top:7px}</style></head><body>
<div class="app"><header><b>1対1チャット</b></header><main id="messages"></main><form id="form"><textarea id="text" maxlength="2000" placeholder="メッセージ…"></textarea><button id="call" type="button">📞</button><button id="send">送信</button></form></div>
<div id="login" class="login"><div class="card"><h2>名前を入力</h2><input id="name" maxlength="30" placeholder="名前"><button id="enter">入室する</button><div id="err" class="err"></div></div></div>
<div id="callbox" class="call hidden"><div class="callcard"><h3 id="ct">音声通話</h3><p id="cs">接続中…</p><div id="ca"></div></div></div><audio id="remote" autoplay playsinline></audio>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import{getFirestore,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,doc,setDoc,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA-SopUchu7bKXw0k2ZoYYds03Lduz-nAk",authDomain:"chat2-9bd77.firebaseapp.com",projectId:"chat2-9bd77",storageBucket:"chat2-9bd77.firebasestorage.app",messagingSenderId:"813264060979",appId:"1:813264060979:web:3b5ae389958989eb2b1946"},ROOM="ryo1031jun0106",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let u,n=localStorage.chat_name||"",pc,st,cu,inc=false,caller=false,unsub,cuu,timer;
$("name").value=n;
$("enter").onclick=()=>{n=$("name").value.trim();if(!n)return $("err").textContent="名前を入力してください";localStorage.chat_name=n;signInAnonymously(auth).catch(e=>$("err").textContent="入室できません。Firebaseの匿名ログインを有効にしてください。")};
onAuthStateChanged(auth,x=>{if(!x)return;u=x;$("login").classList.add("hidden");load();listen()});
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tm(t){let d=t?.toDate?t.toDate():new Date(t);return isNaN(d)?"":d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function load(){onSnapshot(query(collection(db,"rooms",ROOM,"messages"),orderBy("createdAt","asc")),s=>{$("messages").innerHTML="";s.forEach(x=>{let m=x.data(),r=document.createElement("div");r.className="r "+(m.senderId==u.uid?"me":"");r.innerHTML='<div class="b">'+esc(m.text)+'<div class="m">'+esc(m.senderName)+' · '+tm(m.createdAt)+'</div></div>';$("messages").append(r)});$("messages").scrollTop=$("messages").scrollHeight},e=>console.log(e))}
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});

$("form").onsubmit=async e=>{e.preventDefault();let v=$("text").value.trim();if(!v)return;try{await addDoc(collection(db,"rooms",ROOM,"messages"),{text:v,senderId:u.uid,senderName:n,createdAt:serverTimestamp()});$("text").value=""}catch(e){alert("送信できませんでした")}};
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
function panel(t,s,bs){$("ct").textContent=t;$("cs").textContent=s;$("ca").innerHTML="";bs.forEach(x=>{let b=document.createElement("button");b.className=x[0];b.textContent=x[1];b.onclick=x[2];$("ca").append(b)});$("callbox").classList.remove("hidden")}
function close(){clearInterval(timer);if(unsub)unsub();if(cuu)cuu();if(st)st.getTracks().forEach(x=>x.stop());if(pc)pc.close();pc=null;st=null;unsub=cuu=null;$("remote").srcObject=null;$("callbox").classList.add("hidden");inc=caller=false}
async function end(){try{await updateDoc(doc(db,"calls",ROOM),{status:"ended"})}catch(e){}close()}
async function mute(){if(!st)return;let x=st.getAudioTracks()[0];x.enabled=!x.enabled}
async function startCall(){try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});pc=new RTCPeerConnection(ICE);caller=true;st.getTracks().forEach(x=>pc.addTrack(x,st));pc.ontrack=e=>$("remote").srcObject=e.streams[0];pc.onicecandidate=async e=>{if(e.candidate)await addDoc(collection(db,"calls",ROOM,"callerCandidates"),e.candidate.toJSON())};let ref=doc(db,"calls",ROOM),o=await pc.createOffer();await pc.setLocalDescription(o);await setDoc(ref,{callerId:u.uid,callerName:n,status:"ringing",offer:{type:o.type,sdp:o.sdp},createdAt:serverTimestamp()});panel("📞 発信中","相手の応答を待っています",[["no","終了",end]]);unsub=onSnapshot(ref,async s=>{let d=s.data();if(!d||!pc)return;if(d.answer&&pc.signalingState==="have-local-offer")await pc.setRemoteDescription(d.answer);if(d.status==="connected"){panel("📞 通話中","音声通話中",[["mute","ミュート",mute],["no","終了",end]])}if(d.status==="declined"){close();alert("通話を拒否されました")}});cuu=onSnapshot(collection(db,"calls",ROOM,"answerCandidates"),s=>s.docChanges().forEach(async c=>{if(c.type==="added")try{await pc.addIceCandidate(c.doc.data())}catch(e){}}))}catch(e){close();alert("マイクを許可してください")}}
function listen(){unsub=onSnapshot(doc(db,"calls",ROOM),s=>{let d=s.data();if(!d||d.callerId===u.uid||d.status!=="ringing"||!d.offer||pc||inc)return;inc=true;panel("📞 着信",d.callerName+"から着信",[["ok","応答",()=>answer(d)],["no","拒否",async()=>{await updateDoc(doc(db,"calls",ROOM),{status:"declined"});close()}]])})}
async function answer(d){inc=false;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});pc=new RTCPeerConnection(ICE);st.getTracks().forEach(x=>pc.addTrack(x,st));pc.ontrack=e=>$("remote").srcObject=e.streams[0];pc.onicecandidate=async e=>{if(e.candidate)await addDoc(collection(db,"calls",ROOM,"answerCandidates"),e.candidate.toJSON())};let ref=doc(db,"calls",ROOM),s=await getDoc(ref),x=s.data();await pc.setRemoteDescription(x.offer);cuu=onSnapshot(collection(db,"calls",ROOM,"callerCandidates"),q=>q.docChanges().forEach(async c=>{if(c.type==="added")try{await pc.addIceCandidate(c.doc.data())}catch(e){}}));let a=await pc.createAnswer();await pc.setLocalDescription(a);await updateDoc(ref,{answer:{type:a.type,sdp:a.sdp},status:"connected"});panel("📞 通話中","音声通話中",[["mute","ミュート",mute],["no","終了",end]])}catch(e){close();alert("マイクを許可してください")}}
$("call").onclick=startCall;
</script></body></html>
